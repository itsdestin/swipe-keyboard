  gaming-tests:
    # WHY its own job: the Gaming Mode tests (helper, gesture layer, canary, installer, Flatpak and release wiring) used
    # to run only inside the daily Steam canary, which is no check on a pull request. They are plain Python plus Node,
    # need no Flatpak or Qt and finish in about a minute. WHY two files are left out by name: test_daemon.py and
    # test_commit_e2e.py need the compiled daemon and the model files, which only the package builds have, so they run
    # under CTest (tests gaming_daemon and gaming_commit_e2e) in the arch, fedora and flatpak jobs instead.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # WHY Node is installed explicitly: tests/gaming/test_layer.js and fake_page.js run under Node, and a missing Node
      # is a hard failure in those tests, not a skip.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Helper, gesture layer, canary, fetch and ledger tests
        # WHY a loop and not one discover: every other test file is picked up automatically, only the two named files are
        # skipped, and each file's result is reported (a failure in one does not hide the rest).
        run: |
          status=0
          for file in tests/gaming/test_*.py; do
            name=$(basename "$file")
            case "$name" in test_daemon.py|test_commit_e2e.py) echo "skipped here (needs the built daemon, runs under CTest): $name"; continue;; esac
            python3 -I -m unittest discover -s tests/gaming -p "$name" -v || status=1
          done
          exit $status
      - name: Installer, Flatpak and SteamOS release contract tests
        run: |
          python3 -I -m unittest discover -s tests/packaging -p test_gaming_setup.py -v
          python3 -I -m unittest discover -s tests/packaging -p test_flatpak_gaming.py -v
          python3 -I -m unittest discover -s tests/packaging -p test_release_steamos.py -v
          python3 -I -m unittest discover -s tests/packaging -p test_switch_watch.py -v
  keyboard-ci:
    # WHY the name changes with the mode: branch protection requires the exact check "Keyboard CI".
    # A fast-path run reports under a different name, so it can never satisfy that requirement; only
    # a run that built and verified every platform can. Tags are always the full set.
    name: ${{ needs.prepare.outputs.mode == 'fast' && 'Keyboard CI (fast path, not mergeable)' || 'Keyboard CI' }}
    if: ${{ always() }}
    # WHY gaming-tests is waited on here but kept out of the producer set: it builds no release file, yet a green
    # "Keyboard CI" must mean the Gaming Mode tests passed too, in every mode (it runs on drafts as well).
    needs: [prepare, arch, arch-current, update-site-check, fedora, fedora-arm64, flatpak, steamos, gaming-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Read-only: downloading a reused main run's files needs it (card #200).
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gaming Mode tests must pass
        if: ${{ always() }}
        env:
          GAMING_RESULT: ${{ needs.gaming-tests.result }}
        run: |
          if [[ "$GAMING_RESULT" != success ]]; then echo "gaming-tests finished as: $GAMING_RESULT"; exit 1; fi
      # WHY a step per check: a skipped check counts only when its own condition (copied from the job) says it should
      # not have run. A skipped-because-something-failed check therefore still fails "Keyboard CI".
      - name: Current-Arch retest and update-site rehearsal must pass
        if: ${{ always() }}
        env:
          CURRENT_ARCH_RESULT: ${{ needs.arch-current.result }}
          SITE_CHECK_RESULT: ${{ needs.update-site-check.result }}
          REUSE_RUN: ${{ needs.prepare.outputs.reuse_run }}
          PREPARED_MODE: ${{ needs.prepare.outputs.mode }}
        run: |
          fail=0
          want_arch=skipped; if [[ -z "$REUSE_RUN" && "$PREPARED_MODE" != docs ]]; then want_arch=success; fi
          want_site=skipped; if [[ "$PREPARED_MODE" == full && "$GITHUB_REF" != refs/tags/* ]]; then want_site=success; fi
          if [[ "$CURRENT_ARCH_RESULT" != "$want_arch" ]]; then echo "arch-current finished as: $CURRENT_ARCH_RESULT (wanted $want_arch)"; fail=1; fi
          if [[ "$SITE_CHECK_RESULT" != "$want_site" ]]; then echo "update-site-check finished as: $SITE_CHECK_RESULT (wanted $want_site)"; fail=1; fi
          exit $fail
      # Downloads come from this run, or, for a tag reusing main (card #200), only from the main run that
      # prepare chose for this exact commit, in this repository.
      # WHY tags only: files are re-downloaded to hash the exact bytes that get published. Non-release
      # runs publish nothing, and every producer already recorded its own file hashes at creation.
      - uses: actions/download-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/') && needs.prepare.outputs.reuse_run == '' }}
        with:
          pattern: '*-files'
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        if: ${{ needs.prepare.outputs.reuse_run == '' && needs.prepare.outputs.mode != 'docs' }}
        with:
          pattern: '*-evidence'
          merge-multiple: true
          path: evidence
      - uses: actions/download-artifact@v4
        if: ${{ needs.prepare.outputs.reuse_run != '' }}
        with:
          pattern: '*-files'
          merge-multiple: true
          path: release
          run-id: ${{ needs.prepare.outputs.reuse_run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ needs.prepare.outputs.reuse_run != '' }}
        with:
          pattern: '*-evidence'
          merge-multiple: true
          path: evidence
          run-id: ${{ needs.prepare.outputs.reuse_run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Reject any incomplete, stale or failed producer set
        if: ${{ always() }}
        env:
          PRODUCER_STATUSES: ${{ toJSON(needs) }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          FULL_INPUT: ${{ inputs.full }}
          REUSE_RUN: ${{ needs.prepare.outputs.reuse_run }}
          PREPARED_MODE: ${{ needs.prepare.outputs.mode }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # WHY removed: the producer check wants exactly the producer jobs; gaming-tests has its own step above.
          # WHY also removed: arch-current and update-site-check are checks, not producers; they are judged in their own step below.
          statuses=$(jq -c 'del(."gaming-tests", ."arch-current", ."update-site-check")' <<< "$PRODUCER_STATUSES")
          if [[ -n "$REUSE_RUN" ]]; then
            # WHY: this run's producers were skipped on purpose; the results that count are those of the main run
            # whose files are checked below. Only a tag whose own prepare succeeded may do this.
            [[ "$GITHUB_REF" == refs/tags/* && "$PREPARE_RESULT" == success ]] || { echo "reuse outside a successful tag prepare" >&2; exit 1; }
            statuses=$(python3 scripts/ci-reuse.py statuses --run "$REUSE_RUN")
            echo "Gating the files of main run $REUSE_RUN for this exact commit"
          fi
          flag=''
          # Tags always verify the real bytes (the script also refuses this flag on tags).
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then flag='--evidence-only'; fi
          python3 scripts/release.py gate --sha "$GITHUB_SHA" --statuses "$statuses" $flag
      - uses: actions/upload-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: verified-release
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    # WHY the explicit results: without them GitHub skips this job when any job further back was skipped, and a tag
    # that reuses main's packages skips the builders on purpose (v0.5.1-1 passed Keyboard CI and never published).
    # Keyboard CI is the gate that checks those reused files; its success is what counts here.
    if: ${{ !cancelled() && needs.keyboard-ci.result == 'success' && needs.gaming-tests.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'itsdestin/swipe-keyboard' }}
    needs: [keyboard-ci, gaming-tests]
    runs-on: ubuntu-24.04
    # Final package hashes are available before owner-approved compositor acceptance/publication.
    environment: keyboard-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: release
      - name: Publish only the checked bytes, draft until remote hashes match
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-publish.py
      # The signed update website every installed keyboard checks once a day (plan:
      # docs/active/plans/2026-10-23-auto-updates.md). WHY inside publish: it is published under the same owner approval
      # as the release, and the signing key stays behind that approval. Skipped until the owner sets the repository
      # variable FLATPAK_REPO_PUBLISH=true. If it fails, the release itself already stands; nothing half-published.
      - name: Install the site tools
        if: ${{ vars.FLATPAK_REPO_PUBLISH == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg createrepo-c
      - name: Import the signing key (private key never leaves this job)
        if: ${{ vars.FLATPAK_REPO_PUBLISH == 'true' }}
        env:
          # WHY via env, never spliced into script text: secrets must not be echoed or interpolated into commands.
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_REPO_GPG_KEY }}
          GPG_KEY_ID: ${{ vars.FLATPAK_REPO_GPG_KEY_ID }}
        run: |
          test -n "$GPG_PRIVATE_KEY" && test -n "$GPG_KEY_ID" || { echo 'FLATPAK_REPO_GPG_KEY secret and FLATPAK_REPO_GPG_KEY_ID variable must both be set.' >&2; exit 1; }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Build the signed site from the exact released files
        if: ${{ vars.FLATPAK_REPO_PUBLISH == 'true' }}
        env:
          GPG_KEY_ID: ${{ vars.FLATPAK_REPO_GPG_KEY_ID }}
        run: python3 scripts/update_site.py build --release release --tag "$GITHUB_REF_NAME" --key-id "$GPG_KEY_ID" --out site
      - name: Prove each platform's own tool accepts it, with the signature checked
        if: ${{ vars.FLATPAK_REPO_PUBLISH == 'true' }}
        env:
          GPG_KEY_ID: ${{ vars.FLATPAK_REPO_GPG_KEY_ID }}
        run: python3 scripts/update_site.py verify --site site --keyring packaging/updates/update-key.gpg --armored packaging/updates/update-key.asc --bundle "release/swipe-keyboard-$(python3 scripts/release.py version)-x86_64.flatpak" --key-id "$GPG_KEY_ID"
      - uses: actions/upload-pages-artifact@v3
        if: ${{ vars.FLATPAK_REPO_PUBLISH == 'true' }}
        with:
          path: site
  update-site-check:
    # WHY a rehearsal on every full build: the real site is only built for a release tag, so without this its first run
    # would be the release itself. Same script, same checks, a throwaway key made here; the result is never published.
    if: ${{ needs.prepare.outputs.mode == 'full' && !startsWith(github.ref, 'refs/tags/') }}
    # WHY these needs, not keyboard-ci: it only reads the finished package files, so it starts the moment they exist and
    # runs beside the current-Arch retest. "Keyboard CI" waits for it, so it still gates merges.
    needs: [prepare, arch, fedora, fedora-arm64, flatpak, steamos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the site tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg createrepo-c
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-files'
          merge-multiple: true
          path: release
      - name: Build and check the site with a throwaway key
        run: |
          gpg --batch --passphrase '' --quick-generate-key 'Swipe Keyboard CI rehearsal (throwaway)' ed25519 sign 1d
          key=$(gpg --batch --with-colons --list-keys | awk -F: '/^fpr/{print $10; exit}')
          gpg --batch --export "$key" > rehearsal.gpg
          gpg --batch --armor --export "$key" > rehearsal.asc
          python3 scripts/update_site.py build --release release --tag "v$(python3 scripts/release.py version)" --key-id "$key" --out site --test-key
          python3 scripts/update_site.py verify --site site --keyring rehearsal.gpg --armored rehearsal.asc --bundle "release/swipe-keyboard-$(python3 scripts/release.py version)-x86_64.flatpak" --key-id "$key"
  update-site:
    # WHY a separate job: only this one may write to GitHub Pages, and it never sees the signing key.
    # WHY needs.publish.result: same reason as publish (skipped builders further back must not skip the update site).
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'itsdestin/swipe-keyboard' && vars.FLATPAK_REPO_PUBLISH == 'true' }}
    needs: [publish]
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
