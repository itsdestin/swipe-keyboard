          key: ${{ steps.cachekey.outputs.key }}
      - name: Inspect actual ARM RPM ELF, language profiles, QRC and loader
        run: |
          mkdir dist/stage
          cd dist/stage
          rpm2cpio ../swipe-keyboard-$PACKAGE_VERSION.fc44.aarch64.rpm | cpio -idm
          cd ../..
          python3 scripts/package-check.py dist/stage
          test_executable=$(find /home/builder/rpmbuild/BUILD -path '*/redhat-linux-build/plugin/tst_stocklayout' -type f -print -quit)
          test -n "$test_executable"
          python3 scripts/check-stock-layout.py "$test_executable" --runtime-root dist/stage/usr/share/swipe-keyboard
          rpm -qp --requires dist/*aarch64.rpm > dist/package-requires.txt
      - name: Verify installed ARM wrapper and dependency resolution, then remove
        run: |
          dnf -y --setopt=install_weak_deps=False install dist/swipe-keyboard-$PACKAGE_VERSION.fc44.aarch64.rpm
          su builder -c 'XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=KDE swipe-keyboard check'
          dnf -y --setopt=clean_requirements_on_remove=False remove swipe-keyboard
          test ! -e /usr/bin/swipe-keyboard
          test ! -e /usr/share/swipe-keyboard
      - name: Bind ARM RPM metadata and exact final bytes
        run: |
          mkdir release evidence
          cp "dist/swipe-keyboard-$PACKAGE_VERSION.fc44.aarch64.rpm" release/
          python3 scripts/release.py record --target fedora-arm64 --stage dist/stage --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-arm64-files
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-arm64-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  flatpak:
    needs: prepare
    # WHY: optional in the fast path; the Keyboard CI gate requires these to be skipped there and successful otherwise.
    if: ${{ needs.prepare.outputs.mode == 'full' && needs.prepare.outputs.reuse_run == '' }}
    runs-on: ubuntu-26.04
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free hosted-runner space and install isolated build tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # WHY Resolute: signed distribution packages provide Flatpak 1.16+
          # without the extra PPA that blocked builds during an upstream outage.
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak_version=$(flatpak --version)
          dpkg --compare-versions "${flatpak_version#Flatpak }" ge 1.16
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: prepared
      - name: Verify prepared input identity and hashes before executing source
        run: python3 scripts/release.py verify-inputs --directory prepared --sha "$GITHUB_SHA"
      # WHY before the cache block: the dependencies-only build needs the pinned runtimes installed.
      - name: Install signed exact SDK and platform commits
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.kde.Sdk//6.10 org.kde.Platform//6.10
          python3 - <<'PY'
          import json, subprocess
          pins = json.load(open('packaging/flatpak/runtime-lock.json'))
          for name in ('org.kde.Sdk', 'org.kde.Platform'):
              subprocess.run(['flatpak', 'update', '--user', '--noninteractive', '-y', '--commit=' + pins[name], name + '//6.10'], check=True)
          PY
      - name: Decide dependency-cache policy (release tags and forks never use caches)
        id: cachepolicy
        env:
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: python3 scripts/ci-cache.py policy >> "$GITHUB_OUTPUT"
      - name: Name the dependency cache keys
        id: cachekeys
        if: ${{ steps.cachepolicy.outputs.restore == 'true' }}
        run: |
          # ostree checks the restored stage store object by object before it is trusted.
          sudo apt-get install -y ostree zstd
          builder=$(flatpak-builder --version)
          # WHY: stage keys cover manifest, SDK/runtime commits, patches, jobs/flags, tool versions and
          # runner image; flatpak-builder additionally chains a checksum of every module's sources.
          echo "stages=$(python3 scripts/ci-cache.py key flatpak-stages "$builder|x86_64|$ImageVersion" flatpak)" >> "$GITHUB_OUTPUT"
          ccache_digest=$(python3 scripts/ci-cache.py key flatpak-ccache "x86_64" flatpak)
          # WHY a per-commit key: immutable keys; each trusted run saves its updated store.
          echo "ccache=$ccache_digest-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "ccache_digest=$ccache_digest-" >> "$GITHUB_OUTPUT"
          echo "ccache_prefix=$(python3 scripts/ci-cache.py key --prefix flatpak-ccache flatpak)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Qt/Plasma dependency stages (exact key only)
        id: stagecache
        if: ${{ steps.cachepolicy.outputs.restore == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: flatpak-stage-cache.tar.zst
          key: ${{ steps.cachekeys.outputs.stages }}
      # WHY compiler results only: ccache hashes compiler, flags and preprocessed source, so a stale
      # entry is a miss. Only the keyboard's own objects are compiled through it (build-swipe.sh).
      - name: Restore compiler cache
        id: ccacherestore
        if: ${{ steps.cachepolicy.outputs.restore == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder/ccache
          key: ${{ steps.cachekeys.outputs.ccache }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.ccache_digest }}
            ${{ steps.cachekeys.outputs.ccache_prefix }}
      - name: Validate restored dependency stages (any doubt rebuilds them from source)
        id: stagecheck
        if: ${{ steps.stagecache.outputs.cache-hit == 'true' }}
        run: python3 scripts/ci-cache.py unpack-flatpak-state flatpak-stage-cache.tar.zst .flatpak-builder "${{ steps.cachekeys.outputs.stages }}"
      - name: Build only the Qt/Plasma dependency stages to cache them
        if: ${{ steps.cachepolicy.outputs.save == 'true' && steps.stagecheck.outputs.usable != 'true' }}
        run: |
          tar -xzf "prepared/swipe-keyboard-$PACKAGE_VERSION-flatpak-build-inputs.tar.gz" -C prepared
          python3 packaging/flatpak/build.py flatpak-build --repo flatpak-repo --ci-manifest prepared/flatpak-inputs/manifest.json --dependencies-only
          # Packed before the keyboard module runs, so no product output can enter the cache.
          python3 scripts/ci-cache.py pack-flatpak-state .flatpak-builder flatpak-stage-cache.tar.zst "${{ steps.cachekeys.outputs.stages }}"
      - name: Save dependency stages (trusted pushes and dispatch only)
        if: ${{ steps.cachepolicy.outputs.save == 'true' && steps.stagecheck.outputs.usable != 'true' && hashFiles('flatpak-stage-cache.tar.zst') != '' }}
        uses: actions/cache/save@v4
        with:
          path: flatpak-stage-cache.tar.zst
          key: ${{ steps.cachekeys.outputs.stages }}
      - name: Start memory sampling for the build
        run: |
          nohup python3 scripts/ci-memwatch.py sample "$RUNNER_TEMP/memory.log" 5 > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/memory.pid"
      - name: Build and test SDK-native objects and installed loader
        id: flatpakbuild
        run: |
          tar -xzf "prepared/swipe-keyboard-$PACKAGE_VERSION-flatpak-build-inputs.tar.gz" -C prepared
          python3 packaging/flatpak/build.py flatpak-build --repo flatpak-repo --ci-manifest prepared/flatpak-inputs/manifest.json ${{ steps.cachepolicy.outputs.restore == 'true' && '--ccache' || '' }}
          mkdir release evidence
          flatpak build-bundle --arch=x86_64 flatpak-repo "release/swipe-keyboard-$PACKAGE_VERSION-x86_64.flatpak" org.itsdestin.SwipeKeyboard master
          cp "prepared/swipe-keyboard-$PACKAGE_VERSION-flatpak-build-inputs.tar.gz" release/
      - name: Report peak memory and compiler-cache use
        if: ${{ always() }}
        run: |
          kill "$(cat "$RUNNER_TEMP/memory.pid")" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/memory.log" ]; then
            echo "Flatpak build peak memory (KiB): $(python3 scripts/ci-memwatch.py summary "$RUNNER_TEMP/memory.log")" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          ls -la .flatpak-builder/ 2>/dev/null || true
          du -sh .flatpak-builder/ccache flatpak-stage-cache.tar.zst 2>/dev/null || true
      - name: Save compiler cache (trusted pushes and dispatch only)
        if: ${{ !cancelled() && steps.flatpakbuild.outcome == 'success' && steps.cachepolicy.outputs.save == 'true' && steps.ccacherestore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder/ccache
          key: ${{ steps.cachekeys.outputs.ccache }}
      - name: Install exact bundle and bind embedded metadata
        run: |
          flatpak install --user --noninteractive -y "release/swipe-keyboard-$PACKAGE_VERSION-x86_64.flatpak"
          test "$(flatpak info --user --show-ref org.itsdestin.SwipeKeyboard)" = app/org.itsdestin.SwipeKeyboard/x86_64/master
          location=$(flatpak info --user --show-location org.itsdestin.SwipeKeyboard)
          python3 scripts/release.py record --target flatpak --stage "$location" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-files
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  steamos-helper:
    # WHY a separate job: the helper Flatpak does not depend on the main Flatpak, so it builds in parallel
    # with it; only the final assembly waits for both. Optional in the fast path like the other platforms.
    needs: prepare
    if: ${{ needs.prepare.outputs.mode == 'full' && needs.prepare.outputs.reuse_run == '' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free hosted-runner space and install isolated build tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak_version=$(flatpak --version)
          dpkg --compare-versions "${flatpak_version#Flatpak }" ge 1.16
      - name: Install signed exact SDK and platform commits
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.kde.Sdk//6.10 org.kde.Platform//6.10
          python3 - <<'PY'
          import json, subprocess
          pins = json.load(open('packaging/flatpak/runtime-lock.json'))
          for name in ('org.kde.Sdk', 'org.kde.Platform'):
              subprocess.run(['flatpak', 'update', '--user', '--noninteractive', '-y', '--commit=' + pins[name], name + '//6.10'], check=True)
          PY
      - name: Build the GamingHelper Flatpak
        run: |
          # WHY a plain message first: the helper source is written separately; a missing folder must say so, not fail obscurely.
          test -f gaming/helper/swipekb_helper/__main__.py || { echo 'gaming/helper/swipekb_helper/__main__.py is missing: the Gaming Mode helper is not in this commit.' >&2; exit 1; }
          python3 packaging/flatpak/build.py helper-build --repo helper-repo --ci-manifest packaging/flatpak/org.itsdestin.SwipeKeyboard.GamingHelper.json
          mkdir helper-bundle
          flatpak build-bundle --arch=x86_64 helper-repo helper-bundle/helper.flatpak org.itsdestin.SwipeKeyboard.GamingHelper master
      - name: Install the helper bundle and check its permissions
        run: |
          flatpak install --user --noninteractive -y helper-bundle/helper.flatpak
          test "$(flatpak info --user --show-ref org.itsdestin.SwipeKeyboard.GamingHelper)" = app/org.itsdestin.SwipeKeyboard.GamingHelper/x86_64/master
          # WHY: network is the helper's one extra permission (plan Section 9); fail if it gained anything else.
          permissions=$(flatpak info --user --show-permissions org.itsdestin.SwipeKeyboard.GamingHelper)
