name: Keyboard packages
on:
  pull_request:
    # ready_for_review matters: a draft runs the fast path; marking it ready starts the full matrix.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      full:
        description: 'Run all four platforms (branch dispatch is fast-path only by default)'
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: keyboard-${{ github.ref }}
  # WHY pull requests only (card #200): a new push to a pull request makes its older run pointless, and waiting
  # behind it queued runs for hours. main and tags never cancel: each of their runs may become a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Read-only: lets a tag run find and read main's run for the same commit.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      mode: ${{ steps.mode.outputs.mode }}
      reuse_run: ${{ steps.reuse.outputs.run }}
    steps:
      - name: Free hosted-runner space in the background (never a host installation)
        # WHY in the background (card #200): deleting these takes ~2 minutes; only the source preparation below
        # needs the space (its 21 GiB floor), so checkout and the version checks run meanwhile.
        run: nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch /tmp/space-freed' >/dev/null 2>&1 &
      - uses: actions/checkout@v4
        with:
          # The complete Git history is not needed.
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check recipe versions and trusted tag ancestry
        id: version
        run: |
          python3 scripts/release.py check-versions
          echo "version=$(python3 -c 'import json; print(json.load(open("packaging/release-targets.json"))["version"])')" >> "$GITHUB_OUTPUT"
          echo "package_version=$(python3 scripts/release.py version)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(python3 scripts/release.py version)"
            # Only root history is needed for ancestry.
            git fetch --unshallow --no-tags origin +refs/heads/main:refs/remotes/origin/main
            # Build tags only from a source commit already on main.
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi
      - name: Tags reuse main's packages for this exact commit (card #200)
        id: reuse
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        # WHY (owner decision 2026-10-24): main already built and tested these exact bytes; rebuilding cold cost
        # ~25 minutes per release. Empty output = no usable main run, so everything builds cold as before.
        run: echo "run=$(python3 scripts/ci-reuse.py find)" >> "$GITHUB_OUTPUT"
      - name: List the files a pull request changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # WHY only the base commit, no history: comparing two commits' files needs nothing else. Any failure
        # leaves no list, which means the full matrix.
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" && git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed.txt" || rm -f "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt" 2>/dev/null || true
      - name: Choose documentation-only, fast path or full matrix
        id: mode
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          FULL_INPUT: ${{ inputs.full }}
        run: |
          # WHY: docs = a pull request changing only Markdown or docs/ (card #200): no package is built, so the
          # wait is minutes, not ~35. fast = Arch only, for drafts and plain branch dispatch. Tags, main, ready
          # pull requests and `full: true` run everything; unknown situations also run everything.
          echo "mode=$(python3 scripts/release.py mode --changed "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"
      - name: Documentation checks (documentation-only pull requests)
        if: ${{ steps.mode.outputs.mode == 'docs' }}
        run: |
          # README download links name the current release, every release-notes page exists, licence and
          # wording guards. Only the host-independent suites: this runner has no Qt/KF (seconds).
          for name in test_release.py test_publish.py test_release_workflow.py test_release_steamos.py test_licensing.py; do
            python3 -m unittest discover -s tests/packaging -p "$name" -v
          done
          python3 scripts/ci-publish.py check-links
      - name: Prepare pinned complete source once
        if: ${{ steps.reuse.outputs.run == '' && steps.mode.outputs.mode != 'docs' }}
        run: |
          until [ -e /tmp/space-freed ]; do sleep 2; done
          python3 scripts/ci-source.py prepared
          mkdir release evidence
          version=$(python3 -c 'import json; print(json.load(open("packaging/release-targets.json"))["version"])')
          cp "prepared/swipe-keyboard-$version.tar.gz" release/
          python3 scripts/release.py record --target source --sha "$GITHUB_SHA"
      - name: Test release boundary and complete source fixtures
        if: ${{ steps.reuse.outputs.run == '' && steps.mode.outputs.mode != 'docs' }}
        run: |
          mkdir source-tests
          tar -xzf "release/swipe-keyboard-${{ steps.version.outputs.version }}.tar.gz" -C source-tests
          cd "source-tests/swipe-keyboard-${{ steps.version.outputs.version }}"
          # Only stdlib contract tests here; native suites run with Qt/KF in the package jobs.
          python3 -m unittest discover -s tests/packaging -p test_release.py -v
          python3 -m unittest discover -s tests/packaging -p test_publish.py -v
          python3 -m unittest discover -s tests/packaging -p test_release_workflow.py -v
          python3 -m unittest discover -s tests/packaging -p test_release_steamos.py -v
      - uses: actions/upload-artifact@v4
        if: ${{ steps.reuse.outputs.run == '' && steps.mode.outputs.mode != 'docs' }}
        with:
          name: prepared
          path: prepared/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ steps.reuse.outputs.run == '' && steps.mode.outputs.mode != 'docs' }}
        with:
          name: source-files
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: ${{ steps.reuse.outputs.run == '' && steps.mode.outputs.mode != 'docs' }}
        with:
          name: source-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  arch:
    needs: prepare
    # WHY: a tag reusing main's run, and a documentation-only pull request, build nothing (card #200).
    if: ${{ needs.prepare.outputs.reuse_run == '' && needs.prepare.outputs.mode != 'docs' }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    # WHY an output: the retest job checks the stock-layout test program it receives against this hash, which travels
    # by a different route than the artifact itself.
    outputs:
      stocklayout_sha: ${{ steps.retestinput.outputs.stocklayout_sha }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
    steps:
      - name: Use the older public build baseline (disposable container only)
        run: |
          # WHY full downgrade: mixing archived Qt with current headers/libc would
          # silently stamp newer ABI requirements into a supposedly older build.
          # The minimal disposable image has public keys but no local signing
          # key; the archlinux-keyring downgrade hook must be able to sign trust.
          pacman-key --init
          pacman-key --populate archlinux
          printf 'Server = https://archive.archlinux.org/repos/2026/07/01/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          # WHY bounded retries: the archive can hit pacman's low-speed timeout
          # fetching packages/signatures. Reuse verified cache, never bypass trust
          # or dependencies; persistent failures still fail this required job.
          retry_pacman() {
            local attempt
            for attempt in 1 2 3; do
              if pacman "$@"; then return 0; fi
              if (( attempt < 3 )); then sleep 15; fi
            done
            return 1
          }
          retry_pacman -Syyuu --noconfirm
          # WHY nodejs: the engine-daemon end-to-end test (CTest gaming_commit_e2e) drives a fake Steam page in Node; the
          # package recipe itself stays free of it, so the tool is installed here, in the build image only.
          retry_pacman -S --noconfirm --needed base-devel git cmake ninja python python-pip qt6-declarative qt6-virtualkeyboard qt6-tools kwindowsystem kconfig kirigami gtest curl plasma-keyboard nodejs
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: prepared
      - name: Verify prepared input identity and hashes before executing source
        run: python3 scripts/release.py verify-inputs --directory prepared --sha "$GITHUB_SHA"
      - name: Decide dependency-cache policy (release tags and forks never use caches)
        id: cachepolicy
        env:
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: python3 scripts/ci-cache.py policy >> "$GITHUB_OUTPUT"
      - name: Prepare compiler cache
        id: cachekey
        if: ${{ steps.cachepolicy.outputs.restore == 'true' }}
        run: |
          for attempt in 1 2 3; do pacman -S --noconfirm --needed ccache && break; if [ "$attempt" = 3 ]; then exit 1; fi; sleep 15; done
          mkdir -p /var/tmp/ccache-et
          toolchain=$(pacman -Q gcc glibc binutils cmake ninja | tr '\n' ' ')
          digest=$(python3 scripts/ci-cache.py key native-ccache "arch|$(uname -m)|$toolchain" arch)
          # WHY a per-commit key: GitHub keys are immutable, so each trusted run saves its own updated
          # store and later runs start from the newest one (restore-keys), exact build-input match first.
          echo "key=$digest-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "digest=$digest-" >> "$GITHUB_OUTPUT"
          echo "prefix=$(python3 scripts/ci-cache.py key --prefix native-ccache arch)" >> "$GITHUB_OUTPUT"
      # WHY a compiler-result cache only: ccache hashes the compiler's contents, flags, defines and the
      # preprocessed source (headers included), so a stale or foreign entry is a miss (recompile), never
      # different bytes. It covers the keyboard's own objects on non-release runs;
      # the language-asset QRC target opts out in CMake, and QRC generation, install output and
      # packages are never cached. Release tags never reach these steps (policy output is false).
      - name: Restore compiler cache
        id: ccacherestore
        if: ${{ steps.cachepolicy.outputs.restore == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/ccache-et
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: |
            ${{ steps.cachekey.outputs.digest }}
            ${{ steps.cachekey.outputs.prefix }}
      - name: Let the unprivileged builder use the compiler cache
        if: ${{ steps.cachepolicy.outputs.restore == 'true' }}
        run: |
          mkdir -p /var/tmp/ccache-et
          chmod -R a+rwX /var/tmp/ccache-et
          # The product build must never be routed through ccache by PATH masquerading.
          case ":$PATH:" in *ccache*) echo 'ccache wrappers are on PATH' >&2; exit 1;; esac
      - name: Record actual baseline libraries (not hardware acceptance)
        run: |
          pacman -Q glibc gcc-libs qt6-base qt6-declarative qt6-virtualkeyboard kwindowsystem plasma-keyboard python | tee packaging/BASELINE-VERSIONS.txt
          pacman -Si plasma-keyboard | tee packaging/AVAILABLE-KEYBOARD.txt
      - name: Build source and native package as unprivileged builder
        env:
          CCACHE_ON: ${{ steps.cachepolicy.outputs.restore }}
        run: |
          cache_env=''
          if [ "$CCACHE_ON" = true ]; then cache_env='CCACHE_DIR=/var/tmp/ccache-et CCACHE_COMPILERCHECK=content CCACHE_MAXSIZE=1500M CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache'; fi
          useradd -m builder
          mkdir dist
          cp "prepared/swipe-keyboard-$VERSION.tar.gz" dist/
          cp packaging/arch/PKGBUILD dist/
          cd dist
          # Local snapshot checksum is generated, never skip archive verification in CI.
          digest=$(sha256sum swipe-keyboard-$VERSION.tar.gz | cut -d' ' -f1)
          sed -i "s/sha256sums=('SKIP')/sha256sums=('$digest')/" PKGBUILD
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # Resolve the real runtime requirements too; do not bypass compatibility to get a green build.
          su builder -c "cd '$GITHUB_WORKSPACE/dist' && $cache_env makepkg --noconfirm"
      - name: Report compiler-cache use
        if: ${{ !cancelled() && steps.cachepolicy.outputs.restore == 'true' }}
        run: CCACHE_DIR=/var/tmp/ccache-et ccache -s
      - name: Save compiler cache (trusted pushes and dispatch only)
        if: ${{ !cancelled() && steps.cachepolicy.outputs.save == 'true' && steps.ccacherestore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /var/tmp/ccache-et
          key: ${{ steps.cachekey.outputs.key }}
      - name: Inspect actual package payload
        run: |
          mkdir dist/stage
          # makepkg may also emit a debug archive; extract only the installable main package.
          tar -xf dist/swipe-keyboard-$PACKAGE_VERSION-x86_64.pkg.tar.zst -C dist/stage
          python scripts/package-check.py dist/stage
          # Load the actual stripped package payload, not the build tree, in a private offscreen InputPanel.
          python3 scripts/check-stock-layout.py dist/src/swipe-keyboard-$VERSION/build/plugin/tst_stocklayout --runtime-root dist/stage/usr/share/swipe-keyboard
          pacman -Qip dist/swipe-keyboard-$PACKAGE_VERSION-x86_64.pkg.tar.zst > dist/package-metadata.txt
          sha256sum dist/swipe-keyboard-$PACKAGE_VERSION-x86_64.pkg.tar.zst > dist/baseline-package.sha256
      - name: Verify installed wrapper as ordinary user and remove package
        run: |
          pacman -U --noconfirm dist/swipe-keyboard-$PACKAGE_VERSION-x86_64.pkg.tar.zst
          # No compositor is launched or configured: check is read-only, with a normal user's PATH.
          su builder -c 'XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=KDE swipe-keyboard check'
          pacman -R --noconfirm swipe-keyboard
          test ! -e /usr/bin/swipe-keyboard
          test ! -e /usr/share/swipe-keyboard
      # WHY moved out: retesting the same bytes on current Arch needs a fresh container anyway, and it used to run here
      # one step after the other, adding minutes to the critical path. The "arch-current" job below does it in parallel;
      # "Keyboard CI" still waits for it, so nothing merges without it. Same bytes: the tar carries the package, its
      # recorded hash, the unpacked payload and the older-built stock-layout test program.
      - name: Save the inputs of the current-Arch retest
        id: retestinput
        run: |
          mkdir retest-input
          echo "stocklayout_sha=$(sha256sum "dist/src/swipe-keyboard-$VERSION/build/plugin/tst_stocklayout" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          tar -cf retest-input/arch-retest-input.tar dist/stage dist/baseline-package.sha256 "dist/swipe-keyboard-$PACKAGE_VERSION-x86_64.pkg.tar.zst" "dist/src/swipe-keyboard-$VERSION/build/plugin/tst_stocklayout"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-retest-input
          path: retest-input/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Bind package metadata and exact final bytes
        run: |
          mkdir release evidence
          cp "dist/swipe-keyboard-$PACKAGE_VERSION-x86_64.pkg.tar.zst" release/
          python3 scripts/release.py record --target arch --stage dist/stage --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-files
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: arch-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  arch-current:
    # WHY its own job: the bytes built on the older Arch baseline must also work on today's Arch. That check only needs
    # the finished package, so it runs next to the other jobs instead of lengthening the arch job (it is still part of
    # the required "Keyboard CI" result).
    needs: [prepare, arch]
    if: ${{ needs.prepare.outputs.reuse_run == '' && needs.prepare.outputs.mode != 'docs' }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
    steps:
      - name: Bring the fresh container up to date with current Arch
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          # WHY bounded retries: same reason as in the arch job (mirror hiccups must not fail the check by themselves).
          retry_pacman() {
            local attempt
            for attempt in 1 2 3; do
              if pacman "$@"; then return 0; fi
              if (( attempt < 3 )); then sleep 15; fi
            done
            return 1
          }
          retry_pacman -Syyu --noconfirm
          retry_pacman -S --noconfirm --needed git python qt6-declarative qt6-virtualkeyboard kwindowsystem kconfig kirigami curl plasma-keyboard
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: prepared
      - name: Verify prepared input identity and hashes before executing source
        run: python3 scripts/release.py verify-inputs --directory prepared --sha "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: arch-retest-input
          path: retest-input
      - uses: actions/download-artifact@v4
        with:
          name: arch-files
          path: release
      - name: Test identical older-built bytes on current Arch (container only)
        env:
          STOCKLAYOUT_SHA: ${{ needs.arch.outputs.stocklayout_sha }}
        run: |
          useradd -m builder
          mkdir dist
          tar -xf retest-input/arch-retest-input.tar -C .
          # WHY compared with the published artifact and the job output, not with the tar's own hash file: the hash
          # must not travel in the same box as the bytes it vouches for.
          [[ "$(sha256sum < "release/swipe-keyboard-$PACKAGE_VERSION-x86_64.pkg.tar.zst")" == "$(sha256sum < "dist/swipe-keyboard-$PACKAGE_VERSION-x86_64.pkg.tar.zst")" ]] || { echo "package in the retest input differs from the published arch-files package" >&2; exit 1; }
          echo "$STOCKLAYOUT_SHA  dist/src/swipe-keyboard-$VERSION/build/plugin/tst_stocklayout" | sha256sum -c
          pacman -Q glibc gcc-libs qt6-base qt6-declarative qt6-virtualkeyboard kwindowsystem plasma-keyboard python | tee dist/CURRENT-VERSIONS.txt
          sha256sum -c dist/baseline-package.sha256
          python scripts/package-check.py dist/stage
          python3 scripts/check-stock-layout.py dist/src/swipe-keyboard-$VERSION/build/plugin/tst_stocklayout --runtime-root dist/stage/usr/share/swipe-keyboard
          pacman -U --noconfirm dist/swipe-keyboard-$PACKAGE_VERSION-x86_64.pkg.tar.zst
          su builder -c 'XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=KDE swipe-keyboard check'
          pacman -R --noconfirm swipe-keyboard
          test ! -e /usr/bin/swipe-keyboard
          test ! -e /usr/share/swipe-keyboard
  fedora:
    needs: prepare
    # WHY: optional in the fast path; the Keyboard CI gate requires these to be skipped there and successful otherwise.
    if: ${{ needs.prepare.outputs.mode == 'full' && needs.prepare.outputs.reuse_run == '' }}
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
    steps:
      - name: Install RPM tooling
        # WHY nodejs: see the Arch job; it is installed in the build image only, not required by the package.
        run: dnf -y install git rpm-build rpmdevtools dnf-plugins-core cpio findutils nodejs
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: prepared
      - name: Verify prepared input identity and hashes before executing source
        run: python3 scripts/release.py verify-inputs --directory prepared --sha "$GITHUB_SHA"
      - name: Decide dependency-cache policy (release tags and forks never use caches)
        id: cachepolicy
        env:
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: python3 scripts/ci-cache.py policy >> "$GITHUB_OUTPUT"
      - name: Prepare compiler cache
        id: cachekey
        if: ${{ steps.cachepolicy.outputs.restore == 'true' }}
        run: |
          dnf -y install ccache tar zstd
          mkdir -p /var/tmp/ccache-et
          # WHY || true: compilers are installed later (builddep); ccache itself hashes compiler contents.
          toolchain=$(. /etc/os-release; echo "$VERSION_ID "; rpm -q gcc-c++ glibc-devel cmake ninja-build || true)
          digest=$(python3 scripts/ci-cache.py key native-ccache "fedora|$(uname -m)|$toolchain" fedora)
          # WHY a per-commit key: GitHub keys are immutable, so each trusted run saves its own updated
          # store and later runs start from the newest one (restore-keys), exact build-input match first.
          echo "key=$digest-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "digest=$digest-" >> "$GITHUB_OUTPUT"
          echo "prefix=$(python3 scripts/ci-cache.py key --prefix native-ccache fedora)" >> "$GITHUB_OUTPUT"
      # WHY a compiler-result cache only: ccache hashes the compiler's contents, flags, defines and the
      # preprocessed source (headers included), so a stale or foreign entry is a miss (recompile), never
      # different bytes. It covers the keyboard's own objects on non-release runs;
      # the language-asset QRC target opts out in CMake, and QRC generation, install output and
      # packages are never cached. Release tags never reach these steps (policy output is false).
      - name: Restore compiler cache
        id: ccacherestore
        if: ${{ steps.cachepolicy.outputs.restore == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/ccache-et
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: |
            ${{ steps.cachekey.outputs.digest }}
            ${{ steps.cachekey.outputs.prefix }}
      - name: Let the unprivileged builder use the compiler cache
        if: ${{ steps.cachepolicy.outputs.restore == 'true' }}
        run: |
          mkdir -p /var/tmp/ccache-et
          chmod -R a+rwX /var/tmp/ccache-et
          # The product build must never be routed through ccache by PATH masquerading.
          case ":$PATH:" in *ccache*) echo 'ccache wrappers are on PATH' >&2; exit 1;; esac
      - name: Resolve current Fedora 44 build dependencies
        run: |
          # The minimal image's tmpfiles-only package conflicts with systemd BuildRequires.
          if rpm -q systemd-standalone-tmpfiles >/dev/null 2>&1; then
            dnf -y swap systemd-standalone-tmpfiles systemd
          fi
          dnf -y builddep packaging/fedora/swipe-keyboard.spec
          dnf repoquery --latest-limit 1 plasma-keyboard | tee packaging/AVAILABLE-KEYBOARD.txt
      - name: Build source and RPM as unprivileged builder
        env:
          CCACHE_ON: ${{ steps.cachepolicy.outputs.restore }}
        run: |
          cache_env=''
          if [ "$CCACHE_ON" = true ]; then cache_env='CCACHE_DIR=/var/tmp/ccache-et CCACHE_COMPILERCHECK=content CCACHE_MAXSIZE=1500M CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache'; fi
          useradd -m builder
          mkdir dist
          cp "prepared/swipe-keyboard-$VERSION.tar.gz" dist/
          mkdir -p /home/builder/rpmbuild/{SOURCES,SPECS,BUILD,BUILDROOT,RPMS,SRPMS}
          cp dist/*.tar.gz /home/builder/rpmbuild/SOURCES/
          cp packaging/fedora/swipe-keyboard.spec /home/builder/rpmbuild/SPECS/
          chown -R builder:builder /home/builder/rpmbuild
          # Keep the test executable until the extracted-package probe below (RPM 6 cleans BUILD by default).
          su builder -c "$cache_env rpmbuild -ba --noclean /home/builder/rpmbuild/SPECS/swipe-keyboard.spec"
          cp /home/builder/rpmbuild/RPMS/x86_64/*.rpm dist/
          cp /home/builder/rpmbuild/SRPMS/*.rpm dist/
      - name: Report compiler-cache use
        if: ${{ !cancelled() && steps.cachepolicy.outputs.restore == 'true' }}
        run: CCACHE_DIR=/var/tmp/ccache-et ccache -s
      - name: Save compiler cache (trusted pushes and dispatch only)
        if: ${{ !cancelled() && steps.cachepolicy.outputs.save == 'true' && steps.ccacherestore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /var/tmp/ccache-et
          key: ${{ steps.cachekey.outputs.key }}
      - name: Inspect actual RPM payload (no installation or desktop changes)
